name: XDR-01 verification
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run xdr:run -- brute-force
      - run: npm run build
      - name: Verify published report is current
        run: |
          git diff --exit-code -- xdr/brute-force/result.json public/report.json
